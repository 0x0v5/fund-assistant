# nginx 配置（容器内）
# /etc/nginx/conf.d/default.conf
#
# 端口 80：
#   - 静态文件（前端 dist）→ 直接 serve
#   - /api/* → 反代到 uvicorn (127.0.0.1:8000)
#
# gzip 开启：节省前端 bundle 传输（500KB → ~150KB）
# 静态资源 7 天缓存

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20M;

    root /usr/share/nginx/dist;
    index index.html;

    # 日志去 access，避免磁盘爆掉
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health check（FastAPI 路由是 /health，nginx 重写）
    location = /api/health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # 静态资源：长缓存
    location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|svg|ico|gif)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vue SPA fallback（前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
