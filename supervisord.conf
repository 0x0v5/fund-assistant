; supervisord 配置（容器内管 nginx + uvicorn）
; 路径：/etc/supervisor/conf.d/supervisord.conf
;
; 优先级数字小的先起：nginx=10（先 listen 80），uvicorn=20（后起）
; nodaemon=true（前台跑，Docker CMD 入口）
;
; bind mount 模式下：
;   - backend/ 和 scripts/ 挂到容器内，改完代码只需 docker compose restart
;   - uvicorn 默认不带 --reload（reload 会监听文件变更，但容器里 bind mount
;     会触发大量 inotify 事件，反而拖慢；手动 restart 5s 足够快）

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uvicorn]
command=/usr/local/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log
directory=/app/backend
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0